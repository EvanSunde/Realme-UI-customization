name: Release APK

# Push a tag such as v0.7.0 to build, check and publish the signed APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, run checks and sign
        # Maven Central occasionally rate-limits the dependency downloads; retry instead of failing the release.
        run: |
          for attempt in 1 2 3; do
            python3 build.py && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Evan Lockscreen Studio ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*.apk
          fail_on_unmatched_files: true
