name: Release APK

# Publishes the signed APK as a GitHub release named after AndroidManifest's versionName.
# Trigger it by pushing a v* tag, or by pushing a commit that adds docs/releases/v<version>.md;
# in the second case the workflow creates the tag itself.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['docs/releases/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          tag="v$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo "Tag $GITHUB_REF_NAME does not match versionName $tag"; exit 1; fi
          test -f "docs/releases/$tag.md" || { echo "Missing docs/releases/$tag.md"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load the release signing key
        # The key lives only in repository secrets; never fall back to a development key for a release.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS secrets (see CONTRIBUTING.md)."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "EVAN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build, run checks and sign
        env:
          EVAN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          EVAN_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          EVAN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Maven Central occasionally rate-limits the dependency downloads; retry instead of failing the release.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            python3 build.py | tee build.log && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Add the signing certificate to the notes
        run: |
          cp "docs/releases/${{ steps.version.outputs.tag }}.md" "$RUNNER_TEMP/notes.md"
          fingerprint=$(grep -m1 'Certificate SHA-256' build.log | cut -d' ' -f3)
          printf '\n---\nSigning certificate SHA-256: `%s`\n' "$fingerprint" >> "$RUNNER_TEMP/notes.md"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Evan Lockscreen Studio ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*.apk
          fail_on_unmatched_files: true
