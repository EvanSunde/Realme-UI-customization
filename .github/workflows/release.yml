name: Release APK

# Publishes the signed APK as a GitHub release named after AndroidManifest's versionName.
# Trigger it by pushing a v* tag, or by pushing a commit that adds docs/releases/v<version>.md;
# in the second case the workflow creates the tag itself.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['docs/releases/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          tag="v$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo "Tag $GITHUB_REF_NAME does not match versionName $tag"; exit 1; fi
          test -f "docs/releases/$tag.md" || { echo "Missing docs/releases/$tag.md"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, run checks and sign
        # Maven Central occasionally rate-limits the dependency downloads; retry instead of failing the release.
        run: |
          for attempt in 1 2 3; do
            python3 build.py && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Evan Lockscreen Studio ${{ steps.version.outputs.tag }}
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          files: dist/*.apk
          fail_on_unmatched_files: true
