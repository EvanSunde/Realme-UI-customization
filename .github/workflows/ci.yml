name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Java checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, run checks and sign with a throwaway development key
        # Maven Central occasionally rate-limits the dependency downloads.
        run: |
          for attempt in 1 2 3; do
            python3 build.py && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist/*.apk
          retention-days: 7

  ui:
    name: Editor UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
