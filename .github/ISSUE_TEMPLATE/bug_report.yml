name: Bug report
description: Something didn't work or looked wrong on your phone
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: realme 9 (RMX3521)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: realme UI / ColorOS and Android version
      placeholder: realme UI 5.0, Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Studio version
      placeholder: "0.7.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Lock screen clock, Notification shade, Blur, Always-On Display, Icons, Shizuku connection, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Describe what you saw on the screen. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Copy report output
      description: Paste the text from "Copy report" on the Shade or AOD screen, if relevant.
      render: text
